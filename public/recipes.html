        // Function to handle the collapse/expand logic
        function toggleCollapse(id) {
            const content = document.getElementById(`content-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            const button = document.querySelector(`[onclick="toggleCollapse(${id})"]`);

            const isExpanded = content.classList.contains('open');

            if (isExpanded) {
                // Collapse
                content.classList.remove('open');
                icon.classList.remove('rotate-180');
                button.setAttribute('aria-expanded', 'false');
            } else {
                // Expand
                content.classList.add('open');
                icon.classList.add('rotate-180');
                button.setAttribute('aria-expanded', 'true');
            }
        }

        // Render all recipes on page load
        window.onload = function() {
            const container = document.getElementById('recipes-container');
            container.innerHTML = recipesData.map(createRecipeCard).join('');
        };
    </script>
</body>
</html>
